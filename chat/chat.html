<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barber Network Chat</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>
<div class="chat-widget">
    <div class="chat-header">
        <h3>💬 Barber Network Chat</h3>
        <button class="close-chat-btn" id="close-chat-btn">✕</button>
    </div>
    
    <div class="chat-messages" id="chat-messages">
        <div class="empty-messages">No messages yet</div>
    </div>
    
    <div class="chat-input-area">
        <div class="input-row">
            <input type="text" id="chat-input" class="chat-input" placeholder="Type your message...">
            <button id="send-btn" class="send-btn">Send</button>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
            <input type="file" id="chat-image-input" accept="image/jpeg, image/png, image/jpg, image/gif" style="display: none;">
            <button id="image-btn" class="image-btn">📷 Send Image</button>
            <div id="image-preview-container" style="display: none; flex: 1;"></div>
        </div>
    </div>
</div>

<script>
// ==================== CHAT FUNCTIONS ====================

// Get current user data
function getCurrentUser() {
    try {
        const userData = localStorage.getItem('hair_user_data');
        return userData ? JSON.parse(userData) : null;
    } catch(e) {
        console.error('Error getting user data:', e);
        return null;
    }
}

// Send text message
async function sendTextMessage() {
    const input = document.getElementById('chat-input');
    const message = input.value.trim();
    if (!message) return;
    
    const userData = getCurrentUser();
    if (!userData) {
        alert('Please login first');
        return;
    }
    
    try {
        // Get profile picture
        let profilePic = userData.profilePic || '';
        
        const response = await fetch(window.CONFIG?.CHAT_API_URL || CONFIG.CHAT_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'sendMessage',
                username: userData.username,
                fullname: userData.fullname || userData.username,
                profilePic: profilePic,
                message: message
            })
        });
        
        const result = await response.json();
        
        if (result.success) {
            input.value = '';
            await loadMessages();
        } else {
            console.error('Send failed:', result.message);
        }
    } catch(err) {
        console.error('Send error:', err);
    }
}

// Send image message
async function sendImage() {
    const fileInput = document.getElementById('chat-image-input');
    const file = fileInput.files[0];
    if (!file) return;
    
    // Check file size (max 2MB)
    if (file.size > 2 * 1024 * 1024) {
        alert('Image size should be less than 2MB');
        fileInput.value = '';
        return;
    }
    
    const userData = getCurrentUser();
    if (!userData) {
        alert('Please login first');
        return;
    }
    
    // Show loading preview
    const previewContainer = document.getElementById('image-preview-container');
    previewContainer.style.display = 'flex';
    previewContainer.innerHTML = '<span style="font-size:12px; color:#666;">📤 Uploading image...</span>';
    
    try {
        // Convert to Base64
        const base64 = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
        });
        
        // Upload to ImgBB via Apps Script
        const uploadResponse = await fetch(window.CONFIG?.CHAT_API_URL || CONFIG.CHAT_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'uploadImage',
                imageBase64: base64
            })
        });
        
        const uploadResult = await uploadResponse.json();
        
        if (!uploadResult.success || !uploadResult.imageUrl) {
            throw new Error(uploadResult.message || 'Image upload failed');
        }
        
        // Get profile picture
        let profilePic = userData.profilePic || '';
        
        // Send message with image
        const sendResponse = await fetch(window.CONFIG?.CHAT_API_URL || CONFIG.CHAT_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'sendMessage',
                username: userData.username,
                fullname: userData.fullname || userData.username,
                profilePic: profilePic,
                imageUrl: uploadResult.imageUrl
            })
        });
        
        const sendResult = await sendResponse.json();
        
        if (sendResult.success) {
            fileInput.value = '';
            previewContainer.style.display = 'none';
            previewContainer.innerHTML = '';
            await loadMessages();
        } else {
            throw new Error(sendResult.message || 'Send failed');
        }
        
    } catch(err) {
        console.error('Image send error:', err);
        previewContainer.innerHTML = `<span style="font-size:12px; color:#dc3545;">❌ ${err.message}</span>`;
        setTimeout(() => {
            previewContainer.style.display = 'none';
            previewContainer.innerHTML = '';
        }, 2000);
        fileInput.value = '';
    }
}

// Load messages from server
async function loadMessages() {
    const userData = getCurrentUser();
    if (!userData) return;
    
    const messagesContainer = document.getElementById('chat-messages');
    if (!messagesContainer) return;
    
    try {
        const response = await fetch(window.CONFIG?.CHAT_API_URL || CONFIG.CHAT_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'getMessages',
                username: userData.username,
                lastTimestamp: window._lastTimestamp || '0'
            })
        });
        
        const result = await response.json();
        
        if (result.success && result.messages && result.messages.length > 0) {
            // Clear empty state if needed
            if (messagesContainer.children.length === 1 && messagesContainer.children[0].classList?.contains('empty-messages')) {
                messagesContainer.innerHTML = '';
            }
            
            // Add new messages
            result.messages.forEach(msg => {
                addMessageToUI(msg);
            });
            
            // Update last timestamp
            if (result.latestTimestamp) {
                window._lastTimestamp = result.latestTimestamp;
            }
            
            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        // Update unread badge
        if (typeof updateUnreadBadge === 'function') {
            updateUnreadBadge();
        }
        
    } catch(err) {
        console.error('Load messages error:', err);
    }
}

// Add message to UI
function addMessageToUI(msg) {
    const messagesContainer = document.getElementById('chat-messages');
    if (!messagesContainer) return;
    
    // Check if message already exists (avoid duplicates)
    const existingMsg = document.getElementById(`msg-${msg.id}`);
    if (existingMsg) return;
    
    const messageDiv = document.createElement('div');
    messageDiv.className = `message-row ${msg.isOwn ? 'own' : 'other'}`;
    messageDiv.id = `msg-${msg.id}`;
    
    const defaultAvatar = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%231e3a5f'/%3E%3Ctext x='50' y='67' text-anchor='middle' fill='white' font-size='40'%3E👤%3C/text%3E%3C/svg%3E";
    const profilePic = msg.profilePic || defaultAvatar;
    const displayName = msg.fullname || msg.username;
    
    if (!msg.isOwn) {
        // Other user's message (left side with avatar)
        messageDiv.innerHTML = `
            <img src="${profilePic}" class="message-avatar" onclick="viewUserProfile('${escapeHtml(msg.username)}')" onerror="this.src='${defaultAvatar}'">
            <div class="message-bubble">
                <div class="message-sender">${escapeHtml(displayName)}</div>
                <div class="bubble">
                    ${msg.message ? `<p>${escapeHtml(msg.message)}</p>` : ''}
                    ${msg.imageUrl ? `<a href="${msg.imageUrl}" target="_blank" class="bubble-image-link"><img src="${msg.imageUrl}" class="bubble-image" onerror="this.style.display='none'"></a>` : ''}
                </div>
                <div class="message-time">${formatTime(msg.timestamp)}</div>
            </div>
        `;
    } else {
        // Own message (right side, no clickable avatar)
        messageDiv.innerHTML = `
            <div class="message-bubble">
                <div class="bubble">
                    ${msg.message ? `<p>${escapeHtml(msg.message)}</p>` : ''}
                    ${msg.imageUrl ? `<a href="${msg.imageUrl}" target="_blank" class="bubble-image-link"><img src="${msg.imageUrl}" class="bubble-image" onerror="this.style.display='none'"></a>` : ''}
                </div>
                <div class="message-time">${formatTime(msg.timestamp)}</div>
            </div>
            <img src="${profilePic}" class="message-avatar" onerror="this.src='${defaultAvatar}'">
        `;
    }
    
    messagesContainer.appendChild(messageDiv);
}

// Format timestamp
function formatTime(timestamp) {
    if (!timestamp) return '';
    const date = new Date(timestamp);
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// Escape HTML to prevent XSS
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// View user profile (for friend request)
window.viewUserProfile = async function(username) {
    const currentUser = getCurrentUser();
    if (!currentUser || currentUser.username === username) {
        alert('This is you');
        return;
    }
    
    // Check if already friends
    try {
        const response = await fetch(window.CONFIG?.CHAT_API_URL || CONFIG.CHAT_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'getFriends',
                username: currentUser.username
            })
        });
        const result = await response.json();
        const isFriend = result.friends?.some(f => f.username === username) || false;
        
        if (isFriend) {
            alert(`👤 ${username}\n\nYou are friends!`);
        } else {
            const confirm = confirm(`👤 ${username}\n\nSend friend request?`);
            if (confirm) {
                await sendFriendRequest(username);
            }
        }
    } catch(err) {
        console.error('View profile error:', err);
    }
};

// Send friend request
async function sendFriendRequest(toUser) {
    const currentUser = getCurrentUser();
    if (!currentUser) return;
    
    try {
        const response = await fetch(window.CONFIG?.CHAT_API_URL || CONFIG.CHAT_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'sendFriendRequest',
                fromUser: currentUser.username,
                toUser: toUser
            })
        });
        const result = await response.json();
        
        if (result.success) {
            alert('✅ Friend request sent!');
        } else {
            alert('❌ ' + result.message);
        }
    } catch(err) {
        console.error('Send friend request error:', err);
    }
}

// Close chat
function closeChat() {
    const chatWidget = document.querySelector('.chat-widget');
    if (chatWidget) {
        chatWidget.style.display = 'none';
    }
    // Notify parent to hide container
    const container = document.getElementById('chat-container');
    if (container) {
        container.style.display = 'none';
    }
}

// Initialize chat
async function initChat() {
    // Set up event listeners
    const closeBtn = document.getElementById('close-chat-btn');
    const sendBtn = document.getElementById('send-btn');
    const imageBtn = document.getElementById('image-btn');
    const imageInput = document.getElementById('chat-image-input');
    const messageInput = document.getElementById('chat-input');
    
    if (closeBtn) closeBtn.addEventListener('click', closeChat);
    if (sendBtn) sendBtn.addEventListener('click', sendTextMessage);
    if (imageBtn) imageBtn.addEventListener('click', () => imageInput?.click());
    if (imageInput) imageInput.addEventListener('change', sendImage);
    if (messageInput) messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendTextMessage();
    });
    
    // Mark messages as read
    const userData = getCurrentUser();
    if (userData) {
        try {
            await fetch(window.CONFIG?.CHAT_API_URL || CONFIG.CHAT_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'markAsRead',
                    username: userData.username
                })
            });
        } catch(e) {}
    }
    
    // Load initial messages
    await loadMessages();
    
    // Start auto-refresh every 3 seconds
    if (window._chatInterval) clearInterval(window._chatInterval);
    window._chatInterval = setInterval(loadMessages, 3000);
}

// Start chat when page loads
document.addEventListener('DOMContentLoaded', initChat);
</script>
</body>
</html>
