<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚠️ SYSTEM BREACHED</title>
    <style>
        /* ===== RESET & FULL SCREEN ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== FULL SCREEN DARK OVERLAY ===== */
        .prank-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            padding: 20px;
            cursor: pointer;
        }

        /* ===== IMAGE (50% size) ===== */
        .prank-image {
            width: 50%;
            max-width: 400px;
            height: auto;
            border-radius: 16px;
            border: 3px solid #00ff41;
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.3), inset 0 0 40px rgba(0, 255, 65, 0.1);
            margin-bottom: 20px;
            display: block;
            filter: contrast(1.1) brightness(0.9);
            animation: glitch-img 0.3s infinite alternate;
            pointer-events: none;
        }
        @keyframes glitch-img {
            0% { transform: skew(0deg); opacity: 1; }
            25% { transform: skew(1deg); opacity: 0.9; }
            50% { transform: skew(-1deg); opacity: 1; }
            75% { transform: skew(0.5deg); opacity: 0.95; }
            100% { transform: skew(0deg); opacity: 1; }
        }

        /* ===== HACKER TEXT ===== */
        .hacker-title {
            font-size: clamp(1.2rem, 4vw, 2.5rem);
            color: #00ff41;
            text-shadow: 0 0 20px #00ff41, 0 0 40px #00ff41;
            margin-bottom: 10px;
            letter-spacing: 4px;
            animation: blink 1s infinite;
            pointer-events: none;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* ===== TERMINAL COMMAND LINES ===== */
        #terminal {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ff41;
            border-radius: 10px;
            padding: 15px 20px;
            width: 80%;
            max-width: 600px;
            max-height: 200px;
            overflow-y: auto;
            margin: 15px auto;
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            color: #00ff41;
            text-align: left;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.1);
            font-family: 'Courier New', monospace;
            pointer-events: none;
        }
        #terminal .line {
            opacity: 0;
            animation: fadeIn 0.2s forwards;
            margin-bottom: 2px;
        }
        #terminal .line.error { color: #ff4444; }
        #terminal .line.success { color: #44ff44; }
        #terminal .line.warning { color: #ffaa00; }
        @keyframes fadeIn { to { opacity: 1; } }

        #terminal::-webkit-scrollbar { width: 4px; }
        #terminal::-webkit-scrollbar-track { background: #000; }
        #terminal::-webkit-scrollbar-thumb { background: #00ff41; border-radius: 4px; }

        /* ===== RESTORE BUTTON (Now just a music trigger) ===== */
        .restore-btn {
            margin-top: 15px;
            padding: 12px 35px;
            background: transparent;
            color: #00ff41;
            border: 2px solid #00ff41;
            border-radius: 50px;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
            position: relative;
            z-index: 10;
        }
        .restore-btn:hover {
            background: #00ff41;
            color: #000;
            box-shadow: 0 0 40px #00ff41;
        }
        .restore-btn:active { transform: scale(0.95); }

        /* ===== CLICK HINT ===== */
        .click-hint {
            color: #00ff41;
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            opacity: 0.5;
            margin-top: 10px;
            animation: blink 2s infinite;
            pointer-events: none;
        }

        /* ===== SCANLINE & FLICKER EFFECTS ===== */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg,
                rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
                rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
            pointer-events: none;
            z-index: 100000;
            animation: scanlines 0.1s infinite linear;
        }
        @keyframes scanlines { 0% { transform: translateY(0); } 100% { transform: translateY(4px); } }

        .flicker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 100001;
            animation: flicker 0.15s infinite;
            opacity: 0;
        }
        @keyframes flicker {
            0% { opacity: 0; }
            10% { opacity: 0.05; }
            20% { opacity: 0; }
            40% { opacity: 0.02; }
            60% { opacity: 0; }
            80% { opacity: 0.08; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- ===== PRANK OVERLAY (Click anywhere to play music) ===== -->
    <div class="prank-container" id="prankOverlay">
        <div class="scanlines"></div>
        <div class="flicker"></div>

        <img src="123.jpeg" alt="Hacker Image" class="prank-image">
        <div class="hacker-title">⚠️ SYSTEM COMPROMISED ⚠️</div>
        <div id="terminal"></div>

        <!-- Music Play Button (Does NOT reload page) -->
        <button class="restore-btn" id="playBtn">RELOAD PAGE</button>
        <div class="click-hint">🖱️ Click anywhere or press the button to start music</div>
    </div>

    <!-- ===== AUTO-PLAY MUSIC ===== -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <script>
        // ================================================================
        // 1. MUSIC PLAY ON ANY CLICK (screen + button)
        // ================================================================
        let musicStarted = false;
        const audio = document.getElementById('bg-music');

        function playMusic() {
            if (!musicStarted) {
                audio.play().then(() => {
                    musicStarted = true;
                    console.log('🎵 Music started!');
                    // Optionally change button text
                    document.getElementById('playBtn').textContent = '🔊 MUSIC PLAYING';
                }).catch(err => {
                    console.log('⚠️ Autoplay blocked, retry on next click.');
                });
            }
        }

        // Click anywhere on screen
        document.addEventListener('click', playMusic);

        // Click on the button specifically (stops event from bubbling? No need, but we can add)
        document.getElementById('playBtn').addEventListener('click', function(e) {
            e.stopPropagation(); // prevent double trigger (but it's fine)
            playMusic();
        });

        // ================================================================
        // 2. TERMINAL COMMAND LINES
        // ================================================================
        (function terminalCommands() {
            const terminal = document.getElementById('terminal');
            const commands = [
                { text: '> root@server:~# sudo rm -rf /*', type: 'error' },
                { text: '> ERROR: Permission denied.', type: 'error' },
                { text: '> root@server:~# chmod 777 /etc/passwd', type: '' },
                { text: '> WARNING: Unauthorized access detected!', type: 'warning' },
                { text: '> root@server:~# ./exploit --payload reverse_shell', type: '' },
                { text: '> [+] Exploit executed successfully.', type: 'success' },
                { text: '> root@server:~# cat /etc/shadow', type: '' },
                { text: '> root:$6$xyz... (HASHED)', type: '' },
                { text: '> ❗ SYSTEM COMPROMISED ❗', type: 'error' },
                { text: '> root@server:~# dd if=/dev/urandom of=/dev/sda', type: 'error' },
                { text: '> 🔥 DATA CORRUPTION IN PROGRESS...', type: 'error' },
                { text: '> Just Kidding! 😂 This is a prank!', type: 'success' }
            ];

            let index = 0;

            function addLine() {
                if (index >= commands.length) index = 0;
                const cmd = commands[index];
                const line = document.createElement('div');
                line.className = 'line' + (cmd.type ? ' ' + cmd.type : '');
                line.textContent = cmd.text;
                terminal.appendChild(line);
                terminal.scrollTop = terminal.scrollHeight;
                index++;
                const delay = Math.random() * 1200 + 400;
                setTimeout(addLine, delay);
            }
            setTimeout(addLine, 1500);
        })();

        // ================================================================
        // 3. PREVENT RIGHT-CLICK (for fun)
        // ================================================================
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        console.log('🔥 Hacker Prank Activated! Click ANYWHERE or press the button to start music.');
    </script>
</body>
</html>
